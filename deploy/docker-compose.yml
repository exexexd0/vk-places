name: ivanovo-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: places
      POSTGRES_PASSWORD: places
      POSTGRES_DB: places
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U places -d places"]
      interval: 5s
      timeout: 5s
      retries: 20
