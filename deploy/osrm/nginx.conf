worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    access_log off;

    server {
        listen 5000;
        resolver 127.0.0.11 valid=10s ipv6=off;

        location ~ ^/(route|table|match|nearest|trip|tile)/v1/car/ {
            set $osrm_upstream osrm-car:5000;
            proxy_pass http://$osrm_upstream$request_uri;
            proxy_read_timeout 30s;
        }

        location ~ ^/(route|table|match|nearest|trip|tile)/v1/foot/ {
            set $osrm_upstream osrm-foot:5000;
            proxy_pass http://$osrm_upstream$request_uri;
            proxy_read_timeout 30s;
        }

        location / {
            return 404 '{"code":"InvalidUrl","message":"use profile car or foot"}';
        }
    }
}
